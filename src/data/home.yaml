  idea:
    quoteStart: Education today must serve the interests of the individual, the nation and
    quoteEm: humankind
    body: Providing the right start at the right time and under the right guidance will help develop the child’s personality and will be the key to success in his/her career path. KenBridge School is a CBSE English medium school that brings in a fresh and unique approach to schooling. The curriculum, while moored in the framework defined by CBSE, works with a clear focus to develop in our young learners Core, Co-Curricular and Life Management skills.

  vision: KenBridge Schools nurture the spirit of inquiry and enhance the intellectual, ethical, emotional, physical and social potential of each learner.
  mission:
    - Encourage analytical, self-directed learning and creative application of knowledge.
    - Actively promote teamwork, co-operation and effective communication.
    - Create a humane and caring environment that caters to the development of a healthy self-esteem.
    - Inculcate a sense of community service in our children and emphasize the importance of the moral aspects of life.

