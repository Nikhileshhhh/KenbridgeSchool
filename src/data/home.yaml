    eyebrow: CBSE · English Medium · Kalaburagi · Since 2011
    titleLine1: Enlighten your child
    titleEm: with
    titleLine2: KenBridge.
    lead: A CBSE English-medium school with a specially crafted curriculum that builds Core, Co-Curricular and Life Management skills.
    primary: { label: Explore Admissions, href: /admissions }
    tour: Take the virtual tour
    photo: '[Photo · DSC_9673 / drone front view · blurred 24 px, darkened]'
    photoAlt: 'Placeholder: softly blurred campus photograph, drone front view (DSC_9673)'

  values:
