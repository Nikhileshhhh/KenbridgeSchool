# School Information hub and its six pages (Information*, Timings*, Rules*, Decorum*, Song*, Prayer*,
# Disclosure* boards; P17–P23 of KENBRIDGE_SCREEN_PROMPTS_FROM_LIVE_SITE.md). Wording is the boards'.
main:
  hub:
    title: School Information
    lead: Everything families need day to day.
    groups:
      - label: Day to day
        items:
          - { icon: clock, title: School Timings, desc: 'Two terms, bell, class and period timings.', href: /information/timings }
          - { icon: list, title: School Rules, desc: '15 rules on punctuality, uniform, grooming, food and leave.', href: /information/rules }
          - { icon: calendar, title: Decorum, desc: 'Attendance (75%), absence, withdrawal and suspension.', href: /information/decorum }
      - label: Our school
        items:
          - { icon: music, title: School Song, quote: 'For us no mountain too high…', href: /information/song }
          - { icon: flame, title: School Prayer, quote: 'Where the mind is without fear…', by: by Rabindranath Tagore, href: /information/prayer }
      - label: Official
        items:
          - { icon: shield, title: Mandatory Public Disclosure, desc: CBSE-required information and documents., href: /information/disclosure }
    # Downloads. A file with no href is shown without a link until the school supplies it (PLAN §0).
    downloads:
      - { title: Brochure, desc: School prospectus, kind: pdf, service: brochure }
      - { title: Fee Structure, desc: '[Academic year]', kind: pdf }
      - { title: Annual Academic Calendar, desc: '[Academic year]', kind: pdf }
      - { title: CBSE Transfer Certificate, desc: Download a CBSE TC, kind: external, service: tc }

