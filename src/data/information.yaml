  rules:
    title: School Rules
    meta: 15 rules in four groups
    groups:
      - id: arrival
        title: Arrival
        range: i – ii
        rules:
          - { n: i, text: Students are to be within school campus before 1st bell. Late comers will not be allowed to attend the classes. }
          - { n: ii, text: No permission will be granted to any child to leave the school premises during school hours. }
      - id: uniform
        title: Uniform & Grooming
        range: iii – x, xiii
        rules:
          - { n: iii, text: Students should be properly attired in the school uniform. }
          - { n: iv, text: 'School uniform should be neat, washed and ironed.' }
          - { n: v, text: Students must polish shoes and cut nails regularly. }
          - { n: vi, text: Girls with long hair should have them braided and apply oil. }
          - { n: vii, text: 'Girls must avoid fancy haircuts and make-up and growing long nails; applying mehendi or nail polish is against the school rules.' }
          - { n: viii, text: Girls can wear simple ear studs and avoid fancy earrings/hangings. }
          - { n: ix, text: Girls must wear black cycling tights regularly and bring black leggings every day. }
          - { n: x, text: 'Children should not wear valuable (silver, gold, platinum, etc.) ornaments to school.' }
          - { n: xiii, text: 'Boys must avoid fancy haircuts; they must have a short trim haircut and apply oil regularly.' }
      - id: food
        title: Food
        range: xi – xii
        rules:
          - { n: xi, text: Students must bring healthy and nutritious food for lunch and snack breaks. }
          - { n: xii, text: 'Students must avoid junk food, non-vegetarian food, aerated drinks, bubble gum and chewing gum.' }
      - id: leave
        title: Leave & Meetings
        range: xiv – xv
        parents: true
        rules:
          - { n: xiv, text: 'No leave will be sanctioned without prior permission. Parents can take permission from the class teacher for 2 days’ leave and must take permission from the Principal/Vice Principal for 3 or more days.' }
          - { n: xv, text: 'Parents can meet the Principal/Vice Principal (Mon–Fri) between 3 and 4 PM with a prior appointment.' }

  decorum:
    title: Decorum
    lead: 'Attendance, absence, withdrawal and suspension.'
    attendance:
      label: Minimum attendance
      value: 75
      note: 'At least 3 of every 4 working days. Required for promotion, unless relaxed on medical grounds or in an unavoidable emergency.'
    # TODO(content): OPEN-QUESTIONS "Headmistress vs Vice Principal" and "Caution Money vs Security Deposit".
    sections:
      - id: secA
        letter: A
        title: Absence
        points:
          - { id: a1, title: Attendance, text: '75% attendance is compulsory for all students, failing which he/she may not be eligible for promotion. The percentage may be relaxed on medical grounds or in unavoidable emergencies.' }
          - { id: a2, title: Repeated or unexplained absence, text: 'Repeated absence without leave, or unexplained absence for more than 15 consecutive days, may lead to the student’s name being struck off the rolls. Readmission only on payment of a fresh re-admission fee, at the Principal’s/Headmistress’s discretion.' }
          - { id: a3, title: Leave of absence, text: No leave of absence except on an application from parents/guardians for plausible reasons. }
          - { id: a4, title: After an illness, text: 'After an infectious or contagious disease, a doctor’s certificate permitting attendance is required.' }
      - id: secB
        letter: B
        title: Withdrawal / Suspension
        points:
          - { id: b1, title: Refund on withdrawal, text: 'On withdrawal, only caution money is refunded, subject to clearance of all dues; dues are never adjusted against caution money.' }
          - { id: b2, title: Notice of withdrawal, text: 'A written notice of withdrawal is required one clear month in advance, or one month’s tuition fee in lieu.' }
          - id: b3
            title: Asked to leave
            text: 'A student may be asked to leave at the Principal’s/Headmistress’s discretion on these grounds:'
            list: [Disciplinary reasons, Unsatisfactory progress in work, Detention or repeated detention in a class, Any other ground deemed necessary in the interest of the school and its students]

  song:
    title: Our School Song
    kicker: KenBridge School · Kalaburagi
    recording: { meta: '[duration] · recorded by [choir / year]' }
    stanzas:
      - { label: Verse 1, lines: ['For us no mountain too high,', 'For us no river too wide,', 'For us no road too rough,', 'For us no challenge too tough.'] }
      - { label: Verse 2, lines: ['We will cherish what we learnt,', 'We will achieve what we yearn,', 'We will always do our best,', 'We will be better than the rest.'] }
      - { label: Chorus, chorus: true, refrain: [0], lines: ['We can, yes we can.'] }
      - { label: Verse 3, lines: ['We promise to make the world a better place,', 'Uphold the truth; be kind and helpful always,', 'Make our school and parents proud,', 'Stand out from the crowd,', 'Choose right over wrong,', 'Make our nation strong.'] }
      # "KenBridgeians" is kept as sung (OPEN-QUESTIONS #7: only inside the school song).
      - { label: Closing, closing: true, refrain: [0, 1, 4], lines: ['We can, yes we can,', 'We can, O yes we can.', 'Each one a champion,', 'We are the KenBridgeians.', 'We can, O yes we can.', 'Each one a champion,', 'We are the KenBridgeians.'] }

  prayer:
    title: Our School Prayer
    kicker: KenBridge School · Kalaburagi
    subtitle: Let My Country Awake
    author: Rabindranath Tagore
    lines:
      - Where the mind is without fear and the head held high,
      - Where knowledge is free,
      - Where the world has not been broken up into fragments
      - By narrow domestic walls,
      - Where words come out from the depth of truth,
      - Where tireless striving stretches its arms towards perfection,
      - Where the clear stream of reason has not lost its way
      - Into the dreary desert sand of dead habit,
      - Where the mind is led forward by thee
      - Into ever-widening thought and action,
      - Into that heaven of freedom, my Father, let my country awake.

